# Integração contínua do Mathcode (ADR 0027).
#
# Dois jobs independentes: o backend (Python) e o frontend (Node). Cada
# um sobe com o que o projeto exige e nada mais: nenhuma chave, nenhum
# serviço, nenhum deploy. Custo zero (ADR 0001).
#
# O que a CI protege: o parser sem `eval` (ADR 0002), a verificação dos
# resultados (ADR 0010), o event loop livre (ADR 0026) e o contrato da API.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Para rodar na mão, pela aba Actions do GitHub.
  workflow_dispatch:

# O suficiente para ler o repositório, e nada mais.
permissions:
  contents: read

# Um push novo cancela a rodada anterior do mesmo branch: nenhuma fila se
# acumula.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          # O projeto exige 3.14 (PEP 758, entre outras coisas).
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar o backend
        # O job roda dentro de backend/, então é o próprio projeto que se
        # instala: é o mesmo comando do README.
        run: pip install -e ".[dev]"

      - name: Mostrar as versões
        run: python --version && pip list

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Testes
        run: pytest -q

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Uma versão falhando não esconde o resultado da outra.
      fail-fast: false
      matrix:
        # A mínima suportada (o README pede 22.12+) e a atual. Onde a
        # incompatibilidade aparece é na mínima.
        node: ["22.12", "26"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar o frontend
        # `npm ci` usa o package-lock.json e roda o postinstall, que copia o
        # Swagger UI do npm para o backend (nada vem de CDN, ADR 0001).
        run: npm ci

      - name: Mostrar as versões
        run: node --version && npm --version

      - name: Tipos
        run: npm run typecheck

      - name: Lint (oxlint)
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
