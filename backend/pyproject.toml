[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mathcode-backend"
version = "0.1.0"
description = "Mathcode API: deterministic math engine with verification."
license = "MIT"
authors = [{ name = "Pedro Albano" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sympy>=1.14,<2",
    "mpmath>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.13,<3",
    "ruff>=0.16,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# Math symbols the normalizer accepts on purpose (×, ·, −, º...).
allowed-confusables = ["×", "·", "∙", "⋅", "−", "–", "∕", "º", "µ", "ℝ", "ℚ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
